<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlixQuest — {{TITLE}}</title>

    <!-- VideoJS para streams HLS y MP4 directos -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- =====================================================================
         CSS — Todo el diseño del reproductor en un solo bloque
    ====================================================================== -->
    <style>
        /* Reset base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Fondo oscuro centrado — estilo streaming profesional */
        body {
            background: #090b10;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Cabecera: badges + título */
        .header {
            text-align: center;
            margin-bottom: 20px;
            max-width: 920px;
            width: 100%;
        }

        .badges {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        /* Pastillas de estado */
        .badge {
            padding: 4px 14px;
            border-radius: 9999px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .badge-tipo   { background: linear-gradient(135deg, #4f46e5, #7c3aed); }
        .badge-escudo { background: linear-gradient(135deg, #059669, #10b981); }

        /* Título de la película/serie */
        .titulo {
            font-size: 1.7rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
            margin-bottom: 6px;
        }

        /* ── Tarjetas de selección de servidor ─────────────────────────── */
        .info-box {
            background: rgba(79, 70, 229, 0.08);
            border: 1px solid rgba(79, 70, 229, 0.2);
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 0.78rem;
            color: #94a3b8;
            max-width: 920px;
            width: 100%;
            margin-bottom: 18px;
            line-height: 1.6;
        }
        .info-box strong { color: #a5b4fc; }

        .server-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 16px;
            max-width: 920px;
            width: 100%;
            margin-bottom: 24px;
        }

        .server-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 22px 20px;
            text-align: center;
            text-decoration: none;
            color: #94a3b8;
            transition: all 0.2s ease;
            display: block;
        }
        .server-card:hover {
            background: #1e293b;
            border-color: #4f46e5;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.3);
        }

        .server-card .icono   { font-size: 2.2rem; margin-bottom: 10px; }
        .server-card .nombre  { font-weight: 700; font-size: 1.05rem; color: #e2e8f0; }
        .server-card .calidad { font-size: 0.78rem; margin-top: 5px; color: #64748b; }
        .server-card .nota {
            margin-top: 10px;
            font-size: 0.72rem;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 5px;
            padding: 3px 10px;
            display: inline-block;
        }

        /* ── Reproductor de video directo (HLS / MP4) ───────────────────── */
        .player-box {
            width: 100%;
            max-width: 920px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.85),
                        0 0 0 1px rgba(255, 255, 255, 0.06);
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
        }

        /* Pie de página */
        .footer {
            margin-top: 16px;
            color: #334155;
            font-size: 0.76rem;
            text-align: center;
            line-height: 1.6;
        }

        /* Spinner de carga (usado por la página /launch) */
        .spinner-wrap {
            text-align: center;
        }
        .spinner {
            width: 52px;
            height: 52px;
            border: 4px solid #1e293b;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: girar 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes girar { to { transform: rotate(360deg); } }
        .spinner-titulo { font-size: 1rem; font-weight: 600; color: #e2e8f0; }
        .spinner-sub    { font-size: 0.8rem; margin-top: 6px; color: #475569; }
    </style>
</head>
<body>

    <!-- Cabecera dinámica: el Python reemplaza {{TITULO}}, {{TIPO_STREAM}} -->
    <div class="header">
        <div class="badges">
            <span class="badge badge-tipo">{{TIPO_STREAM}}</span>
            <span class="badge badge-escudo">✓ Chrome bloquea popups automáticos</span>
        </div>
        <h1 class="titulo">{{TITULO}}</h1>
    </div>

    <!-- Contenido dinámico: tarjetas de servidor, reproductor HLS, etc.
         El Python reemplaza {{CONTENIDO}} con el HTML adecuado según el tipo -->
    {{CONTENIDO}}

    <!-- Pie de página -->
    <div class="footer">
        FlixQuest Player · Popups bloqueados nativamente por Chrome · {{TIPO_STREAM}}
    </div>

    <!-- =====================================================================
         JS — Todo el JavaScript en un solo bloque al final del body
         (buena práctica: el DOM ya está listo cuando se ejecuta)
    ====================================================================== -->
    <script>
        /* ── 1. Escudo anti-publicidad ─────────────────────────────────────
           Bloquea window.open() antes de que cualquier anuncio pueda usarlo.
           Los proveedores de streaming inyectan scripts que llaman window.open
           para abrir tabs de publicidad — esto los neutraliza. */
        window.open = function(url, target, features) {
            console.warn('[FlixQuest Shield] Popup bloqueado:', url);
            return null;
        };

        /* ── 2. Script dinámico del reproductor ────────────────────────────
           El Python reemplaza {{SCRIPT_PLAYER}} con el código específico
           para cada modo: HLS, MP4 directo, o redirección a embed.
           Ejemplos de lo que puede ir aquí:
             - HLS:  new Hls(); hls.loadSource(src); hls.attachMedia(video);
             - MP4:  video.src = url; video.play();
             - Embed: window.location.href = url_proveedor; */
        {{SCRIPT_PLAYER}}
    </script>

</body>
</html>
